<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agents</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<!-- self-hosted (same-origin): cdn.tailwindcss.com sends no CORP/CORS headers, so COEP blocks it in Firefox/Safari -->
<script src="vendor/tailwind-3.4.17.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<!-- cross-origin isolation (SharedArrayBuffer) for the Wasmer clang toolchain on static hosting.
     credentialless COEP so cross-origin CDN scripts/images keep loading without CORP headers. -->
<script src="js/boot-a.js"></script>
<script src="coi-serviceworker.min.js"></script>
<!-- real git in the browser -->
<script src="https://unpkg.com/@isomorphic-git/lightning-fs@4.6.0/dist/lightning-fs.min.js"></script>
<script src="https://unpkg.com/isomorphic-git@1.27.1/index.umd.min.js"></script>
<script src="https://unpkg.com/isomorphic-git@1.27.1/http/web/index.umd.js"></script>
<style>
  html,body{height:100%}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#374151;border-radius:20px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .blink{animation:blink .8s ease-in-out infinite}
</style>
</head>
<body class="bg-gray-900 text-gray-100 h-[100dvh] overflow-hidden font-sans text-sm">
<!-- auto-updater: if the cached page is stale, force a truly-fresh navigation (bypasses any SW/CDN cache) -->
<script src="js/boot-b.js"></script>

<div class="flex h-full relative">

  <!-- mobile backdrop -->
  <div id="backdrop" onclick="toggleDisk()" class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"></div>

  <!-- ====== Simulated disk (IndexedDB) — off-canvas drawer on mobile ====== -->
  <aside id="disk" class="w-72 max-w-[85vw] shrink-0 bg-gray-950 border-r border-gray-800 flex flex-col
         fixed md:static inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 transition-transform duration-200">
    <div class="p-3 border-b border-gray-800 flex items-center justify-between gap-2">
      <span id="disklabel" class="font-semibold flex items-center gap-2 shrink-0">💾 Disco virtual</span>
      <div class="flex items-center gap-2">
        <span id="diskinfo" class="text-[10px] text-gray-300"></span>
        <button onclick="downloadDiskAsZip()" title="Descargar todo el disco como ZIP" class="text-[10px] text-gray-400 hover:text-gray-200 border border-gray-700 hover:bg-gray-700 rounded px-2 py-0.5">Zip</button>
        <button onclick="eraseDisk()" title="Borrar todo el disco virtual" class="text-[10px] text-red-400 hover:text-red-200 border border-red-900/50 hover:bg-red-900/30 rounded px-2 py-0.5">Erase</button>
      </div>
    </div>
    <div id="files" class="flex-1 overflow-y-auto scroll p-2 space-y-1 text-xs"></div>
    <div class="p-2 border-t border-gray-800 space-y-2">
      <div class="flex gap-1">
        <input id="newpath" placeholder="ruta/archivo.txt" class="flex-1 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs">
        <button onclick="newFile()" class="bg-gray-700 hover:bg-gray-600 rounded px-2 text-xs">+</button>
      </div>
      <div class="grid grid-cols-2 gap-1">
        <button onclick="ghPull()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1 text-xs">⬇ Pull repo</button>
        <button onclick="ghPush()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1 text-xs">⬆ Push repo</button>
      </div>
      <input id="ghrepo" placeholder="owner/name (push/pull)" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-[11px]" value="FiveTechSoft/Agents">
      <input id="ghpath" placeholder="carpeta destino en el repo" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-[11px]" value="docs/space">
      <input id="ghtok" type="password" placeholder="GitHub token (solo push)" class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-[11px]">
    </div>
  </aside>

  <!-- ====== Chat / shell ====== -->
  <main class="flex-1 flex flex-col min-w-0">
    <div class="p-3 border-b border-gray-800 bg-gray-850 flex items-center justify-between gap-2">
      <span class="font-semibold flex items-center gap-2">
        <button onclick="toggleDisk()" class="md:hidden bg-gray-800 border border-gray-700 rounded px-2 py-1" title="Disco">💾</button>
        <span id="agi" onclick="togglePause()" title="Pausar / reanudar el agente" class="inline-block cursor-pointer select-none">😎</span> <a href="https://github.com/fivetechsoft/agents" target="_blank" rel="noopener" title="Código fuente en GitHub" class="hover:text-blue-400">Agents</a> <!-- v03f646a -->
        <span class="relative">
          <button id="modeltag" onclick="toggleModelMenu(event)" title="Agente IA en uso — click para cambiar" class="text-[10px] font-mono text-gray-300 bg-gray-800 border border-gray-700 rounded px-1.5 py-0.5 truncate max-w-[180px] hover:bg-gray-700 cursor-pointer"></button>
          <div id="modelmenu" class="hidden absolute left-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg z-50 overflow-hidden min-w-[200px]"></div>
        </span>
        <span id="status" class="hidden text-[10px] font-mono text-gray-400 ml-1 bg-gray-800 border border-gray-700 rounded px-1.5 py-0.5"></span>
      </span>
      <div class="flex items-center gap-1.5 text-xs">
        <div class="relative">
          <button id="langbtn" onclick="toggleLangMenu(event)" title="Idioma" class="flex items-center gap-1 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs">
            <img id="langflag" class="w-4 h-3 object-cover rounded-[1px]" alt=""><span id="langcode" class="font-medium"></span>
          </button>
          <div id="langmenu" class="hidden absolute right-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg z-50 overflow-hidden min-w-[120px]"></div>
        </div>
        <button id="thinkbtn" onclick="toggleThink()" title="Ver razonamiento del modelo" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">🧠</button>
        <span class="relative flex items-center">
          <button id="ttsbtn" onclick="toggleTts()" title="Voz: leer respuestas en alto" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-l px-2 py-1">🔊</button>
          <button onclick="toggleVoiceMenu(event)" title="Elegir voz" class="bg-gray-800 hover:bg-gray-700 border border-l-0 border-gray-700 rounded-r px-1 py-1 text-[9px] text-gray-400">▾</button>
          <div id="voicemenu" class="hidden absolute right-0 top-full mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg z-50 overflow-hidden min-w-[230px] max-h-72 overflow-y-auto"></div>
        </span>
        <button id="micbtn" onclick="toggleMic()" title="Dictar por micrófono" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">🎤</button>
        <button id="demobtn" onclick="runDemo()" title="Demo automática" class="bg-blue-700 hover:bg-blue-600 border border-blue-600 rounded px-2 py-1">▶ Demo</button>
        <button id="stopbtn" onclick="stopAgent()" title="Detener" class="bg-gray-800 hover:bg-red-700 border border-gray-700 rounded px-2 py-1">■ Stop</button>
        <button onclick="flowCard()" title="Flow: secuencia de lo que hizo el agente (didáctico)" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">🔀 Flow</button>
        <button onclick="shareSession()" title="Compartir sesión (URL de solo lectura)" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">🔗 Share</button>
        <button onclick="copyChat()" title="Copiar conversación" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">📋 Copy</button>
        <button onclick="runCmd('/clear')" title="Limpiar (/clear)" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">🗑 Clear</button>
        <button onclick="runCmd('/help')" title="Comandos disponibles" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-2 py-1">❔ /help</button>
      </div>
    </div>
    <div id="chat" class="flex-1 overflow-y-auto scroll p-4 space-y-4"></div>
    <div class="p-3 border-t border-gray-800">
      <div class="flex gap-2 items-center">
        <input id="fileinp" type="file" multiple class="hidden">
        <button onclick="document.getElementById('fileinp').click()" title="Adjuntar al disco" class="shrink-0 text-gray-500 hover:text-gray-300 px-2 py-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input id="prompt" placeholder="comando: ls · write a.txt Hola · read a.txt · del a.txt · (o pregunta al LLM)"
          onkeydown="promptKey(event)" oninput="acUpdate()" onclick="acUpdate()"
          class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500">
        <button id="sendbtn" onclick="run()" class="bg-blue-600 hover:bg-blue-500 rounded-lg px-6 py-3 text-base font-semibold shrink-0">Enviar</button>
      </div>
      <div id="acdd" class="hidden" style="position:fixed;z-index:60;display:none;max-height:320px;overflow-y:auto;background:#111827;border:1px solid #374151;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);"></div>
      <div class="text-[10px] text-gray-500 text-center mt-2 flex justify-center gap-4">
        <span><kbd class="bg-gray-700 px-1 rounded border border-gray-600">Ctrl</kbd>+<kbd class="bg-gray-700 px-1 rounded border border-gray-600">K</kbd> limpiar</span>
        <span><kbd class="bg-gray-700 px-1 rounded border border-gray-600">Esc</kbd> parar</span>
        <span><kbd class="bg-gray-700 px-1 rounded border border-gray-600">↑</kbd>/<kbd class="bg-gray-700 px-1 rounded border border-gray-600">↓</kbd> historial</span>
      </div>
    </div>
  </main>
</div>

<!-- editor modal -->
<div id="ed" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-3 md:p-6 z-50">
  <div class="bg-gray-800 border border-gray-700 rounded-xl w-full max-w-6xl flex flex-col" style="height:92vh">
    <div class="p-3 border-b border-gray-700 flex items-center justify-between">
      <span id="edpath" class="font-mono text-xs text-pink-400"></span>
      <div class="flex gap-2">
        <button id="edprev" onclick="togglePreview()" class="hidden bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs">👁 Preview</button>
        <button id="edhtml" onclick="toggleHtmlView()" class="hidden bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs">🌐 Ver</button>
        <button onclick="saveEd()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs">Guardar</button>
        <button onclick="closeEd()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs">Cerrar</button>
      </div>
    </div>
    <textarea id="edtext" class="flex-1 bg-gray-900 p-3 font-mono text-xs resize-none focus:outline-none"></textarea>
    <div id="edpreview" class="hidden flex-1 overflow-y-auto bg-gray-900 p-4 text-sm prose-invert"></div>
    <iframe id="edhtmlframe" class="hidden flex-1 bg-white rounded-b-xl" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        <div id="eddbviewer" class="hidden flex-1 flex flex-col overflow-hidden">
          <div class="flex-1 flex overflow-hidden">
            <div id="dbv-tables" class="w-44 shrink-0 border-r border-gray-700 overflow-y-auto p-2 space-y-1 bg-gray-850">
              <div class="text-[10px] text-gray-500 uppercase tracking-wide px-2 mb-1">Tablas</div>
            </div>
            <div class="flex-1 flex flex-col overflow-hidden">
              <div class="flex items-center justify-between px-3 py-1 border-b border-gray-800">
                <span id="dbv-info" class="text-xs text-gray-400"></span>
                <div class="flex items-center gap-1">
                  <button id="dbv-prev" onclick="dbvPage(-1)" class="px-2 py-0.5 bg-gray-700 rounded text-xs hover:bg-gray-600 hidden">←</button>
                  <span id="dbv-pageinfo" class="text-[10px] text-gray-500 hidden"></span>
                  <button id="dbv-next" onclick="dbvPage(1)" class="px-2 py-0.5 bg-gray-700 rounded text-xs hover:bg-gray-600 hidden">→</button>
                </div>
              </div>
              <div id="dbv-rows" class="flex-1 overflow-auto p-2">
                <div class="text-xs text-gray-500 p-4 text-center">Selecciona una tabla para ver los datos</div>
              </div>
            </div>
          </div>
          <div class="border-t border-gray-700">
            <div id="dbv-sql-toggle" onclick="toggleDbvSql()" class="text-xs text-gray-500 px-3 py-1.5 cursor-pointer hover:text-gray-300 select-none border-b border-gray-800">▸ SQL</div>
            <div id="dbv-sql-panel" class="hidden p-2 space-y-2">
              <textarea id="dbv-sql-input" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-gray-200 font-mono focus:outline-none focus:border-blue-500" placeholder="SELECT * FROM ... WHERE ..."></textarea>
              <div class="flex items-center gap-2">
                <button onclick="dbvRunSql()" class="text-xs bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded">Ejecutar SQL</button>
                <span id="dbv-sql-result" class="text-[10px] text-gray-500"></span>
              </div>
            </div>
          </div>
        </div>
  </div>
</div>

<script src="js/agent-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
